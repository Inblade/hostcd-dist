name: site-consistency

# The public dist repo requires a PR but had no status checks. This runs the
# dependency-free site checker (JSON-LD validity, pricing, demo duration,
# dangling anchors, broken relative links) so the drift a manual review caught
# cannot land again. This job name (site-consistency) is the required status-check context.

on:
  pull_request:
  push:
    # Also runs on the release-pushed docs-sync branches: the check posts its
    # status on that branch's head commit, which is the head of the PR that
    # publish-sync opens — so the PR's required "site-consistency" check is
    # already satisfied and auto-merge can land it without a human. (A PR opened
    # by GITHUB_TOKEN does not itself trigger the pull_request event.)
    branches: [main, 'docs/sync-**']

permissions:
  contents: read

jobs:
  site-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check site consistency
        run: python3 scripts/check-site.py
