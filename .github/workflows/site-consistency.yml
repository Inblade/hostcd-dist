name: site-consistency

# The public dist repo requires a PR but had no status checks. This runs the
# dependency-free site checker (JSON-LD validity, pricing, demo duration,
# dangling anchors, broken relative links) so the drift a manual review caught
# cannot land again. This job name (site-consistency) is the required status-check context.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  site-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check site consistency
        run: python3 scripts/check-site.py
